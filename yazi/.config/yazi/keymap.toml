[[mgr.prepend_keymap]]
on   = "J"
run  = "shell '~/.config/yazi/yazi-fzf-dir jump' --block"
desc = "Cd to directory with fzf"

[[mgr.prepend_keymap]]
on   = "M"
run  = "shell '~/.config/yazi/yazi-fzf-dir move' --block"
desc = "Move selected files to directory"

[[mgr.prepend_keymap]]
on   = "C"
run  = "shell '~/.config/yazi/yazi-fzf-dir copy' --block"
desc = "Copy selected files to directory"

[[mgr.prepend_keymap]]
on   = "B"
run  = 'shell -- wallpaper set "%h"'
desc = "Set selected image as wallpaper"

[[mgr.prepend_keymap]]
on   = "l"
run  = "enter"
desc = "Enter directory or open file"

[[mgr.prepend_keymap]]
on   = [ "g", "d" ]
run  = "cd ~/in"
desc = "Go to XDG downloads"

[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/docs"
desc = "Go to XDG documents"

[[mgr.prepend_keymap]]
on   = [ "g", "m" ]
run  = "cd ~/media"
desc = "Go to media"

[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/projects"
desc = "Go to projects"
