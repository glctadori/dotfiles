source = ~/.config/themes/current/hyprlock.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = ~/.config/themes/current/wallpaper.png

    blur_passes = 3
    blur_size = 8

    brightness = 0.7
}

input-field {
    monitor =
    size = 240, 48
    position = 0, -40

    dots_center = true
    dots_size = 0.22
    dots_spacing = 0.35
    fade_on_empty = true

    rounding = -1

    placeholder_text =

    outline_thickness = 3
    shadow_passes = 2

    inner_color = $lock_inner
    outer_color = $lock_outer
    font_color = $lock_text
    check_color = $lock_check
    fail_color = $lock_fail
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    color = $lock_text

    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    color = $lock_text

    position = 0, 55
    halign = center
    valign = center
}
