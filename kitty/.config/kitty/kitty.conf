font_family JetBrainsMono Nerd Font
font_size 11
window_padding_width 10 8
remember_window_size no
confirm_os_window_close 0
shell_integration enabled
scrollback_lines 10000
scrollback_pager_history_size 10
scrollback_pager nvim --noplugin -i NONE -u ~/.config/kitty/copy-mode.lua -
allow_remote_control yes

background_opacity 0.85

map alt+j scroll_line_down
map alt+k scroll_line_up
map super+y kitten ~/.config/kitty/copy-mode.py
map ctrl+shift+h kitten ~/.config/kitty/copy-mode.py

include ../themes/current/kitty.conf
